name: online_voting_app
description: Secure online voting app with Firebase auth, one-vote-per-poll and an admin panel.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.4
  intl: ^0.19.0

flutter:
  uses-material-design: true
